<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试地图</title>
<style>
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --ink: #20262e;
    --muted: #64707c;
    --line: #e2e6ea;
    --chip: #eef1f4;
    --gate: #a85c10;
    --gate-bg: #fbf1e2;
    --gate-line: #e3c090;
    --flow: #39638e;
    --flow-bg: #edf3f9;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13171c; --surface: #1b2128; --ink: #e7eaee; --muted: #98a2ac;
      --line: #2a323c; --chip: #242c35; --gate: #e0a055; --gate-bg: #2b2216;
      --gate-line: #59421f; --flow: #85add7; --flow-bg: #1d2733;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13171c; --surface: #1b2128; --ink: #e7eaee; --muted: #98a2ac;
    --line: #2a323c; --chip: #242c35; --gate: #e0a055; --gate-bg: #2b2216;
    --gate-line: #59421f; --flow: #85add7; --flow-bg: #1d2733;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    line-height: 1.65; margin: 0; padding: 2.5rem 1.25rem 4rem;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header h1 { font-size: 1.7rem; font-weight: 700; margin: 0 0 .4rem; text-wrap: balance; }
  header p.lede { color: var(--muted); margin: 0 0 1rem; max-width: 40em; }
  .meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 2rem; }
  .meta span {
    background: var(--chip); border-radius: 999px; padding: .15rem .7rem;
    font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums;
  }

  .flow-scroll { overflow-x: auto; margin: 0 0 2.25rem; padding-bottom: .35rem; }
  .flow { display: flex; align-items: stretch; min-width: max-content; }
  .stage {
    background: var(--flow-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: .45rem .8rem; text-align: center; min-width: 7.5rem;
  }
  .stage b { display: block; font-size: .82rem; font-weight: 600; }
  .stage i { font-style: normal; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage.gate { background: var(--gate-bg); border-color: var(--gate-line); }
  .stage.gate b { color: var(--gate); }
  .stage.aside { background: var(--chip); opacity: .85; }
  .arrow { align-self: center; color: var(--muted); padding: 0 .45rem; font-size: .85rem; }
  .flow-note { font-size: .82rem; color: var(--muted); margin: -.9rem 0 2.25rem; max-width: 44em; }

  .toolbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .8rem; }
  .toolbar h2 { font-size: 1.05rem; margin: 0; }
  .toolbar button {
    font: inherit; font-size: .78rem; color: var(--flow);
    background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: .2rem .7rem; cursor: pointer;
  }
  .toolbar button:hover { border-color: var(--flow); }
  .toolbar button:focus-visible { outline: 2px solid var(--flow); outline-offset: 2px; }

  details.scene {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: .7rem; overflow: hidden;
  }
  details.scene.gated { border-color: var(--gate-line); }
  details.scene > summary {
    list-style: none; cursor: pointer;
    display: grid; grid-template-columns: auto 1fr auto; gap: .9rem;
    align-items: baseline; padding: .85rem 1.1rem;
  }
  details.scene > summary::-webkit-details-marker { display: none; }
  details.scene > summary:hover { background: var(--chip); }
  details.scene > summary:focus-visible { outline: 2px solid var(--flow); outline-offset: -2px; }
  .num { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  .gated .num { color: var(--gate); font-weight: 600; }
  .scene-title b { font-weight: 600; font-size: .95rem; }
  .scene-title small { display: block; color: var(--muted); font-size: .82rem; margin-top: .1rem; }
  .count {
    font-variant-numeric: tabular-nums; font-size: .78rem; color: var(--muted);
    background: var(--chip); border-radius: 999px; padding: .1rem .6rem; white-space: nowrap;
  }
  .gated .count { background: var(--gate-bg); color: var(--gate); }

  .scene-body { border-top: 1px solid var(--line); padding: .9rem 1.1rem 1rem; }
  .scene-body p.why { font-size: .85rem; color: var(--muted); margin: .8rem 0 0; max-width: 44em; }

  table.clauses { width: 100%; border-collapse: collapse; font-size: .87rem; }
  table.clauses td { padding: .45rem 0; vertical-align: top; border-top: 1px solid var(--line); }
  table.clauses tr:first-child td { border-top: none; }
  td.situation { width: 42%; padding-right: 1rem; }
  td.situation b { font-weight: 600; }
  td.result { color: var(--muted); padding-right: 1rem; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; width: 3rem; }

  details.raw { margin-top: .9rem; }
  details.raw > summary { cursor: pointer; font-size: .78rem; color: var(--flow); list-style: none; }
  details.raw > summary::-webkit-details-marker { display: none; }
  details.raw > summary::before { content: "▸ "; }
  details.raw[open] > summary::before { content: "▾ "; }
  details.raw > summary:focus-visible { outline: 2px solid var(--flow); outline-offset: 2px; }

  .cases-scroll { overflow-x: auto; margin-top: .5rem; }
  table.cases { width: 100%; border-collapse: collapse; font-size: .76rem; line-height: 1.5; }
  table.cases th {
    text-align: left; font-weight: 600; color: var(--muted); font-size: .72rem;
    letter-spacing: .05em; padding: .35rem .6rem; border-bottom: 1px solid var(--line);
    background: var(--chip); position: sticky; top: 0;
  }
  table.cases td { padding: .32rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.case { font-family: var(--mono); font-size: .7rem; color: var(--muted); min-width: 16rem; }
  td.point { min-width: 11rem; }
  td.cl { color: var(--muted); white-space: nowrap; }
  tr.file-row td {
    font-family: var(--sans); font-weight: 600; font-size: .74rem; color: var(--ink);
    background: var(--chip); border-bottom: 1px solid var(--line);
  }

  footer { margin-top: 2.4rem; border-top: 1px solid var(--line); padding-top: 1.1rem; font-size: .75rem; color: var(--muted); }
  .empty-hint { color: var(--muted); font-size: .9rem; border: 1px dashed var(--line); border-radius: 10px; padding: 1.2rem; max-width: 40em; }

  @media (prefers-reduced-motion: no-preference) {
    details.scene > summary, .toolbar button { transition: background .15s, border-color .15s; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
window.DATA = null; /*__TESTMAP_DATA__*/
</script>
<script>
(function () {
  'use strict';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function render(data) {
    var app = document.getElementById('app');
    app.textContent = '';
    document.title = data.title || '测试地图';

    // 头部
    var header = el('header');
    header.appendChild(el('h1', null, data.title || '测试地图'));
    if (data.lede) header.appendChild(el('p', 'lede', data.lede));
    if (data.meta && data.meta.length) {
      var meta = el('div', 'meta');
      data.meta.forEach(function (m) { meta.appendChild(el('span', null, m)); });
      header.appendChild(meta);
    }
    app.appendChild(header);

    // 流程条
    if (data.flow && data.flow.length) {
      var scroll = el('div', 'flow-scroll');
      var flow = el('div', 'flow');
      data.flow.forEach(function (s, i) {
        if (i > 0) flow.appendChild(el('div', 'arrow', s.kind === 'aside' ? '＋' : '→'));
        var stage = el('div', 'stage' + (s.kind && s.kind !== 'main' ? ' ' + s.kind : ''));
        stage.appendChild(el('b', null, s.label));
        if (s.sub) stage.appendChild(el('i', null, s.sub));
        flow.appendChild(stage);
      });
      scroll.appendChild(flow);
      app.appendChild(scroll);
      if (data.flowNote) app.appendChild(el('p', 'flow-note', data.flowNote));
    }

    // 工具条
    var toolbar = el('div', 'toolbar');
    toolbar.appendChild(el('h2', null, (data.scenes ? data.scenes.length : 0) + ' 个场景'));
    var btn = el('button', null, '展开全部');
    btn.type = 'button';
    toolbar.appendChild(btn);
    app.appendChild(toolbar);

    // 场景卡
    (data.scenes || []).forEach(function (scene) {
      var card = el('details', 'scene' + (scene.gated ? ' gated' : ''));
      var summary = el('summary');
      summary.appendChild(el('span', 'num', scene.num));
      var title = el('span', 'scene-title');
      title.appendChild(el('b', null, scene.title));
      if (scene.outcome) title.appendChild(el('small', null, scene.outcome));
      summary.appendChild(title);
      summary.appendChild(el('span', 'count', scene.count));
      card.appendChild(summary);

      var body = el('div', 'scene-body');

      if (scene.clauses && scene.clauses.length) {
        var clauses = el('table', 'clauses');
        scene.clauses.forEach(function (c) {
          var tr = el('tr');
          var sit = el('td', 'situation');
          if (c.label) { sit.appendChild(el('b', null, c.label)); if (c.situation) sit.appendChild(document.createTextNode('——' + c.situation)); }
          else sit.textContent = c.situation || '';
          tr.appendChild(sit);
          tr.appendChild(el('td', 'result', c.result || ''));
          tr.appendChild(el('td', 'n', c.count != null ? String(c.count) : ''));
          clauses.appendChild(tr);
        });
        body.appendChild(clauses);
      }

      if (scene.note) body.appendChild(el('p', 'why', scene.note));

      var groups = scene.caseGroups || [];
      var total = groups.reduce(function (n, g) { return n + (g.cases ? g.cases.length : 0); }, 0);
      if (total > 0) {
        var raw = el('details', 'raw');
        var files = groups.map(function (g) { return g.file; }).filter(Boolean).join(' + ');
        raw.appendChild(el('summary', null, '逐条用例（' + total + (files ? ' · ' + files : '') + '）'));
        var wrap = el('div', 'cases-scroll');
        var table = el('table', 'cases');
        var head = el('tr');
        ['案例', '测试点', '情形'].forEach(function (h) { head.appendChild(el('th', null, h)); });
        table.appendChild(head);
        groups.forEach(function (g) {
          if (groups.length > 1 && g.file) {
            var fr = el('tr', 'file-row');
            var td = el('td', null, g.file + '（' + g.cases.length + '）');
            td.colSpan = 3;
            fr.appendChild(td);
            table.appendChild(fr);
          }
          (g.cases || []).forEach(function (c) {
            var tr = el('tr');
            tr.appendChild(el('td', 'case', c.name));
            tr.appendChild(el('td', 'point', c.point || ''));
            tr.appendChild(el('td', 'cl', c.clause || ''));
            table.appendChild(tr);
          });
        });
        wrap.appendChild(table);
        raw.appendChild(wrap);
        body.appendChild(raw);
      }

      card.appendChild(body);
      app.appendChild(card);
    });

    if (data.footer) app.appendChild(el('footer', null, data.footer));

    btn.addEventListener('click', function () {
      var scenes = document.querySelectorAll('details.scene');
      var anyClosed = Array.prototype.some.call(scenes, function (d) { return !d.open; });
      Array.prototype.forEach.call(scenes, function (d) { d.open = anyClosed; });
      btn.textContent = anyClosed ? '收起全部' : '展开全部';
    });
  }

  function showHint(message) {
    var app = document.getElementById('app');
    app.textContent = '';
    app.appendChild(el('div', 'empty-hint',
      message + ' 两种用法：把 JSON 注入本模板生成单文件报告（推荐，可直接双击打开）；或把 test-map.json 放在本目录并用本地服务访问（如 python3 -m http.server）。'));
  }

  if (window.DATA) {
    render(window.DATA);
  } else {
    fetch('test-map.json')
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(render)
      .catch(function () { showHint('未找到测试数据。'); });
  }
})();
</script>
</body>
</html>
